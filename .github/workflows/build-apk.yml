name: Build Android APK

# Aciona o workflow em cada push na branch main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: 🔨 Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Faz checkout do código do repositório
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o JDK 17 (necessário para compilar Android)
      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Aceita as licenças do Android SDK
      - name: 📋 Aceitar licenças do Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 4. Configura o Gradle (sem necessidade de wrapper no repositório)
      - name: 🔧 Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 5. Compila o APK de debug
      - name: 🏗️ Compilar APK Debug
        run: gradle assembleDebug

      # 6. Faz upload do APK como artifact para download
      - name: 📦 Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
